project: brasileirao-predictor-ai
seed: 42
competition: brasileirao_serie_a
cutoffs_hours: [24, 48]
default_cutoff_hours: 24

# Seasons configuration
train_seasons: [2021, 2022]
validation_seasons: [2023]
test_seasons: [2024]

# Model variants to evaluate
models:
  - prior
  - numeric_lgbm
  - news_count_lgbm
  - contextual_lgbm
  - poisson

# Metrics configuration
primary_metric: log_loss
secondary_metrics:
  - brier
  - ece
  - accuracy
  - macro_f1

comparison: paired_on_same_match_ids

# Statistical significance bootstrap
bootstrap:
  group_by: round_or_week
  samples: 2000
  confidence_level: 0.95

# Promotion gate criteria
promotion:
  min_relative_logloss_improvement: 0.02
  require_temporal_consistency: true
  allow_negative_result: true
