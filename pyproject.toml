[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao-predictor-ai"
version = "1.0.0"
description = "Predição de resultados do Brasileirão Série A com fusão de dados estatísticos e extração estruturada de contexto esportivo por LLM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Brasileirão Predictor AI Research Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
    "rapidfuzz>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
