services:
  - type: web
    name: brasileirao-predictor-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /healthz
    envVars:
      - key: AS_OF_HOURS
        value: "24"
      - key: LLM_PROVIDER
        value: "mock"
      - key: DATABASE_URL
        fromDatabase:
          name: brpredictor-db
          property: connectionString

databases:
  - name: brpredictor-db
    plan: standard
    postgresMajorVersion: 16
